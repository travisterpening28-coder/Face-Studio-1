<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080a0f">
<title>Face Studio V3 — Full Body Driver</title>
<style>
:root{
  color-scheme:dark;
  --bg:#080a0f;--panel:#111722;--line:#273143;--text:#f7f8fb;--muted:#9aa6b8;
  --a:#8b5cf6;--b:#ec4899;--ok:#34d399;--bad:#fb7185
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{overflow:hidden}
.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);background:#080a0fe8;backdrop-filter:blur(14px);z-index:3}
.brand{font-weight:800;letter-spacing:-.02em}
.status{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.stage{position:relative;min-height:0;overflow:hidden;background:#020305;display:grid;place-items:center}
video{display:none}
canvas{width:100%;height:100%;display:block;object-fit:contain;background:#020305}
.badges{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.badge{font-size:11px;padding:6px 8px;border-radius:999px;background:#080b12cc;border:1px solid #ffffff20;backdrop-filter:blur(10px)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bad);margin-right:5px}.dot.ok{background:var(--ok)}
.panel{background:#0d1119f2;border-top:1px solid var(--line);padding:10px 12px max(10px,env(safe-area-inset-bottom));display:grid;gap:8px}
.row{display:grid;grid-template-columns:1fr 1fr 48px;gap:8px}
button,.fileLabel{border:0;border-radius:13px;padding:12px 10px;font:700 14px system-ui;color:white;text-align:center;background:linear-gradient(135deg,var(--a),var(--b));cursor:pointer}
button.secondary,.fileLabel.secondary{background:#171e2b;border:1px solid var(--line)}
button.icon{font-size:19px}
input[type=file]{display:none}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.chip{display:flex;justify-content:center;align-items:center;gap:5px;font-size:11px;padding:8px 6px;border-radius:10px;background:#111722;border:1px solid var(--line)}
.chip input{accent-color:var(--a)}
.tune{display:grid;grid-template-columns:76px 1fr 44px;gap:8px;align-items:center;font-size:12px}
.tune input{width:100%;accent-color:var(--a)}.val{color:var(--muted);text-align:right}
.sheet{position:absolute;left:10px;right:10px;bottom:10px;background:#111722e8;border:1px solid var(--line);border-radius:15px;padding:11px;backdrop-filter:blur(12px);display:none}
.sheet.show{display:block}.sheet strong{font-size:13px}.sheet p{margin:5px 0 0;color:var(--muted);font-size:12px;line-height:1.45}
.server{display:grid;grid-template-columns:1fr 90px;gap:8px}
.server input{min-width:0;border:1px solid var(--line);background:#0a0f17;color:var(--text);border-radius:11px;padding:10px 11px;font-size:12px}
.server button{padding:10px}
@media(min-width:720px){.app{max-width:640px;margin:auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Face Studio V3</div>
    <div class="status" id="status">Loading motion AI…</div>
  </header>

  <main class="stage">
    <video id="cam" playsinline muted autoplay></video>
    <canvas id="out"></canvas>
    <div class="badges">
      <div class="badge"><span id="camDot" class="dot"></span><span id="camText">Camera off</span></div>
      <div class="badge"><span id="faceDot" class="dot"></span><span id="faceText">Face</span></div>
      <div class="badge"><span id="poseDot" class="dot"></span><span id="poseText">Body</span></div>
      <div class="badge"><span id="handDot" class="dot"></span><span id="handText">Hands</span></div>
      <div class="badge" id="fps">0 fps</div>
    </div>
    <div id="sheet" class="sheet"><strong id="sheetTitle"></strong><p id="sheetText"></p></div>
  </main>

  <section class="panel">
    <div class="row">
      <label class="fileLabel secondary" for="refFile">Choose woman</label>
      <input id="refFile" type="file" accept="image/*">
      <button id="start" class="icon">▶</button>
      <button id="flip" class="secondary icon">↻</button>
    </div>

    <div class="chips">
      <label class="chip"><input id="mirror" type="checkbox" checked>Mirror</label>
      <label class="chip"><input id="showFace" type="checkbox" checked>Face</label>
      <label class="chip"><input id="showBody" type="checkbox" checked>Body</label>
      <label class="chip"><input id="showHands" type="checkbox" checked>Hands</label>
    </div>

    <div class="tune"><span>Smoothing</span><input id="smooth" type="range" min="0" max=".9" step=".01" value=".45"><span class="val" id="smoothV">45%</span></div>

    <div class="server">
      <input id="serverUrl" placeholder="Optional generator WebSocket URL">
      <button id="connect" class="secondary">Connect</button>
    </div>
  </section>
</div>

<script type="module">
import {
  FaceLandmarker, PoseLandmarker, HandLandmarker, FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/+esm";

const $=id=>document.getElementById(id);
const video=$("cam"),canvas=$("out"),ctx=canvas.getContext("2d",{alpha:false,desynchronized:true});
let vision,faceAI,poseAI,handAI,stream,running=false,facing="user",lastVideo=-1;
let prev={face:null,pose:null,hands:null},ws=null,refUrl=null;
let fpsFrames=0,fpsStart=performance.now();

const POSE_EDGES=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[27,29],[29,31],[24,26],[26,28],[28,30],[30,32]];
const HAND_EDGES=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

function msg(t){$("status").textContent=t}
function note(title,text){
  $("sheetTitle").textContent=title;$("sheetText").textContent=text;$("sheet").classList.add("show");
  clearTimeout(note.timer);note.timer=setTimeout(()=>$("sheet").classList.remove("show"),4200);
}
$("smooth").oninput=()=>$("smoothV").textContent=Math.round(+$("smooth").value*100)+"%";

async function initAI(){
  try{
    vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm");
    const common={delegate:"GPU"};
    faceAI=await FaceLandmarker.createFromOptions(vision,{
      baseOptions:{...common,modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"},
      runningMode:"VIDEO",numFaces:1,outputFaceBlendshapes:true,outputFacialTransformationMatrixes:true
    });
    poseAI=await PoseLandmarker.createFromOptions(vision,{
      baseOptions:{...common,modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task"},
      runningMode:"VIDEO",numPoses:1
    });
    handAI=await HandLandmarker.createFromOptions(vision,{
      baseOptions:{...common,modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"},
      runningMode:"VIDEO",numHands:2
    });
    msg("Motion AI ready — tap ▶");
  }catch(e){
    console.error(e);msg("Could not load motion AI");note("AI error","Check your internet connection and reload the page.");
  }
}

async function openCamera(){
  try{
    if(!window.isSecureContext){note("HTTPS required","Open this from your GitHub Pages HTTPS link.");return}
    if(stream)stream.getTracks().forEach(t=>t.stop());
    try{
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false});
    }catch(e){
      stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});
    }
    video.srcObject=stream;video.muted=true;video.setAttribute("playsinline","");await video.play();
    running=true;lastVideo=-1;prev={face:null,pose:null,hands:null};
    $("camDot").classList.add("ok");$("camText").textContent=facing==="user"?"Front camera":"Back camera";$("start").textContent="■";
    msg("Tracking face + body + hands");
    requestAnimationFrame(loop);
  }catch(e){
    console.error(e);msg("Camera failed");note("Camera error",(e.name||"Error")+": "+(e.message||"Could not start camera"));
  }
}
function closeCamera(){
  running=false;stream?.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;$("start").textContent="▶";
  $("camDot").classList.remove("ok");$("camText").textContent="Camera off";
}
$("start").onclick=()=>running?closeCamera():openCamera();
$("flip").onclick=async()=>{facing=facing==="user"?"environment":"user";if(running)await openCamera()};

$("refFile").onchange=e=>{
  const f=e.target.files?.[0];if(!f)return;
  if(refUrl)URL.revokeObjectURL(refUrl);
  refUrl=URL.createObjectURL(f);
  note("Reference selected","The motion driver is ready. This reference can be sent to the photorealistic generator in the next stage.");
};

function resize(){
  const w=video.videoWidth||720,h=video.videoHeight||1280;
  if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}
}
function projectLandmarks(arr){
  const mirror=$("mirror").checked;
  return arr?.map(p=>({x:(mirror?1-p.x:p.x)*canvas.width,y:p.y*canvas.height,z:p.z||0,visibility:p.visibility??1}))||null;
}
function smoothPoints(name,next){
  if(!next)return null;
  const s=+$("smooth").value,k=1-s;
  if(!prev[name]||prev[name].length!==next.length){prev[name]=next.map(p=>({...p}));return prev[name]}
  for(let i=0;i<next.length;i++){
    prev[name][i].x+=(next[i].x-prev[name][i].x)*k;
    prev[name][i].y+=(next[i].y-prev[name][i].y)*k;
    prev[name][i].z+=(next[i].z-prev[name][i].z)*k;
    prev[name][i].visibility=next[i].visibility;
  }
  return prev[name];
}
function drawVideo(){
  const m=$("mirror").checked;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle="#020305";ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.save();if(m){ctx.translate(canvas.width,0);ctx.scale(-1,1)}ctx.drawImage(video,0,0,canvas.width,canvas.height);ctx.restore();
}
function line(a,b,width=3){
  if(!a||!b)return;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineWidth=width;ctx.stroke();
}
function dot(p,r=3){
  if(!p)return;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();
}
function drawPose(p){
  if(!p||!$("showBody").checked)return;
  ctx.save();ctx.strokeStyle="rgba(139,92,246,.95)";ctx.fillStyle="rgba(236,72,153,.95)";
  for(const [a,b] of POSE_EDGES)line(p[a],p[b],4);
  for(const q of p)if((q.visibility??1)>.45)dot(q,3.5);
  ctx.restore();
}
function drawHands(hands){
  if(!hands||!$("showHands").checked)return;
  ctx.save();ctx.strokeStyle="rgba(52,211,153,.95)";ctx.fillStyle="rgba(52,211,153,.95)";
  for(const h of hands){
    for(const [a,b] of HAND_EDGES)line(h[a],h[b],3);
    for(const q of h)dot(q,2.6);
  }ctx.restore();
}
function drawFace(f){
  if(!f||!$("showFace").checked)return;
  ctx.save();ctx.fillStyle="rgba(251,191,36,.8)";
  for(let i=0;i<f.length;i+=6)dot(f[i],1.6);
  ctx.restore();
}
function compact(points){
  if(!points)return null;
  return points.map(p=>[
    +(p.x/canvas.width).toFixed(4),
    +(p.y/canvas.height).toFixed(4),
    +p.z.toFixed(4),
    +(p.visibility??1).toFixed(3)
  ]);
}
function sendFrame(data){
  if(!ws||ws.readyState!==1)return;
  try{
    ws.send(JSON.stringify({
      type:"motion_frame",
      t:performance.now(),
      width:canvas.width,height:canvas.height,
      mirror:$("mirror").checked,
      face:compact(data.face),
      pose:compact(data.pose),
      hands:data.hands?.map(compact)||[],
      blendshapes:data.blendshapes||[]
    }));
  }catch(e){}
}

$("connect").onclick=()=>{
  const url=$("serverUrl").value.trim();
  if(!url){note("No server yet","This is optional for now. V3 already tracks your motion locally.");return}
  try{
    ws?.close();ws=new WebSocket(url);
    ws.onopen=()=>{msg("Connected to generator");$("connect").textContent="Connected"};
    ws.onclose=()=>{$("connect").textContent="Connect";msg("Generator disconnected")};
    ws.onerror=()=>note("Connection error","Could not connect to that WebSocket address.");
  }catch(e){note("Bad address","Use a ws:// or wss:// generator address.");}
};

async function loop(ts){
  if(!running)return;
  resize();drawVideo();
  if(faceAI&&poseAI&&handAI&&video.readyState>=2&&video.currentTime!==lastVideo){
    lastVideo=video.currentTime;
    try{
      const [fr,pr,hr]=await Promise.all([
        faceAI.detectForVideo(video,ts),
        poseAI.detectForVideo(video,ts),
        handAI.detectForVideo(video,ts)
      ]);
      const face=fr.faceLandmarks?.[0]?smoothPoints("face",projectLandmarks(fr.faceLandmarks[0])):null;
      const pose=pr.landmarks?.[0]?smoothPoints("pose",projectLandmarks(pr.landmarks[0])):null;
      const hands=(hr.landmarks||[]).map((h,i)=>smoothPoints("hands"+i,projectLandmarks(h)));
      $("faceDot").classList.toggle("ok",!!face);
      $("poseDot").classList.toggle("ok",!!pose);
      $("handDot").classList.toggle("ok",hands.length>0);
      $("faceText").textContent=face?"Face locked":"Face";
      $("poseText").textContent=pose?"Body locked":"Body";
      $("handText").textContent=hands.length?`${hands.length} hand${hands.length>1?"s":""}`:"Hands";
      drawPose(pose);drawHands(hands);drawFace(face);
      sendFrame({
        face,pose,hands,
        blendshapes:fr.faceBlendshapes?.[0]?.categories?.map(c=>[c.categoryName,+c.score.toFixed(4)])||[]
      });
    }catch(e){console.error(e)}
  }
  fpsFrames++;if(ts-fpsStart>800){$("fps").textContent=Math.round(fpsFrames*1000/(ts-fpsStart))+" fps";fpsFrames=0;fpsStart=ts}
  requestAnimationFrame(loop);
}

canvas.width=720;canvas.height=1280;
ctx.fillStyle="#020305";ctx.fillRect(0,0,canvas.width,canvas.height);
ctx.fillStyle="#f5f7fb";ctx.textAlign="center";ctx.font="700 31px system-ui";ctx.fillText("Full-body motion driver",360,605);
ctx.fillStyle="#9aa6b8";ctx.font="18px system-ui";ctx.fillText("Tap ▶ to track face, body, and hands",360,642);

initAI();
</script>
</body>
</html>
