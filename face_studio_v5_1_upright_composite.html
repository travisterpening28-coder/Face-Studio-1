<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080a0f">
<title>Face Studio V5.1 — Upright Composite</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.22.0/dist/tf-core.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.22.0/dist/tf-backend-webgl.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-segmentation@1.0.2/dist/body-segmentation.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1/selfie_segmentation.js"></script>
<style>
:root{color-scheme:dark;--bg:#080a0f;--panel:#111722;--line:#273143;--text:#f7f8fb;--muted:#9aa6b8;--a:#8b5cf6;--b:#ec4899;--ok:#34d399;--bad:#fb7185}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{overflow:hidden}.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);background:#080a0fe8;backdrop-filter:blur(14px);z-index:3}
.brand{font-weight:800}.status{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:58%}
.stage{position:relative;min-height:0;overflow:hidden;background:#020305;display:grid;place-items:center}
video{display:none}canvas{width:100%;height:100%;display:block;object-fit:contain;background:#020305}
.badges{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.badge{font-size:11px;padding:6px 8px;border-radius:999px;background:#080b12cc;border:1px solid #ffffff20;backdrop-filter:blur(10px)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bad);margin-right:5px}.dot.ok{background:var(--ok)}
.panel{background:#0d1119f2;border-top:1px solid var(--line);padding:10px 12px max(10px,env(safe-area-inset-bottom));display:grid;gap:8px}
.row{display:grid;grid-template-columns:1fr 1fr 48px;gap:8px}
button,.fileLabel{border:0;border-radius:13px;padding:12px 10px;font:700 14px system-ui;color:#fff;text-align:center;background:linear-gradient(135deg,var(--a),var(--b));cursor:pointer}
button.secondary,.fileLabel.secondary{background:#171e2b;border:1px solid var(--line)}button.icon{font-size:19px}input[type=file]{display:none}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.chip{display:flex;justify-content:center;align-items:center;gap:5px;font-size:11px;padding:8px 6px;border-radius:10px;background:#111722;border:1px solid var(--line)}.chip input{accent-color:var(--a)}
.tune{display:grid;grid-template-columns:76px 1fr 46px;gap:8px;align-items:center;font-size:12px}.tune input{width:100%;accent-color:var(--a)}.val{color:var(--muted);text-align:right}
.sheet{position:absolute;left:10px;right:10px;bottom:10px;background:#111722e8;border:1px solid var(--line);border-radius:15px;padding:11px;backdrop-filter:blur(12px);display:none}.sheet.show{display:block}.sheet strong{font-size:13px}.sheet p{margin:5px 0 0;color:var(--muted);font-size:12px;line-height:1.45}
@media(min-width:720px){.app{max-width:640px;margin:auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">Face Studio V5.1</div><div class="status" id="status">Loading scene AI…</div></header>
<main class="stage">
<video id="cam" playsinline muted autoplay></video>
<canvas id="out"></canvas>
<div class="badges">
<div class="badge"><span id="camDot" class="dot"></span><span id="camText">Camera</span></div>
<div class="badge"><span id="segDot" class="dot"></span><span id="segText">Cutout</span></div>
<div class="badge"><span id="faceDot" class="dot"></span><span id="faceText">Face</span></div>
<div class="badge"><span id="poseDot" class="dot"></span><span id="poseText">Body</span></div>
<div class="badge" id="fps">0 fps</div>
</div>
<div id="sheet" class="sheet"><strong id="sheetTitle"></strong><p id="sheetText"></p></div>
</main>
<section class="panel">
<div class="row">
<label class="fileLabel secondary" for="refFile">Choose woman</label>
<input id="refFile" type="file" accept="image/*">
<button id="start" class="icon">▶</button>
<button id="flip" class="secondary icon">↻</button>
</div>
<div class="chips">
<label class="chip"><input id="mirror" type="checkbox" checked>Mirror</label>
<label class="chip"><input id="body" type="checkbox" checked>Body</label>
<label class="chip"><input id="face" type="checkbox" checked>Face</label>
<label class="chip"><input id="maskDebug" type="checkbox">Mask</label>
</div>
<div class="tune"><span>Opacity</span><input id="opacity" type="range" min=".35" max="1" step=".01" value=".98"><span class="val" id="opacityV">98%</span></div>
<div class="tune"><span>Feather</span><input id="feather" type="range" min="0" max="18" step="1" value="7"><span class="val" id="featherV">7px</span></div>
<div class="tune"><span>Body size</span><input id="bodyScale" type="range" min=".75" max="1.35" step=".01" value=".92"><span class="val" id="bodyScaleV">0.92×</span></div>
</section>
</div>

<script type="module">
import {FaceLandmarker,PoseLandmarker,FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/+esm";
const $=id=>document.getElementById(id),video=$("cam"),canvas=$("out"),ctx=canvas.getContext("2d",{alpha:false,desynchronized:true});
const refImg=new Image();
let vision,faceImgAI,faceVidAI,poseImgAI,poseVidAI,segmenter,stream,running=false,facing="user",lastVideo=-1;
let refFace=null,refPose=null,refMask=null,refCut=null,refURL=null,prevFace=null,prevPose=null;
let frames=0,fpsStart=performance.now(),segBusy=false,liveSeg=null,segCounter=0;

function msg(t){$("status").textContent=t}
function note(a,b){$("sheetTitle").textContent=a;$("sheetText").textContent=b;$("sheet").classList.add("show");clearTimeout(note.t);note.t=setTimeout(()=>$("sheet").classList.remove("show"),4200)}
function bind(id,fmt){const e=$(id),v=$(id+"V"),f=()=>v.textContent=fmt(+e.value);e.oninput=f;f()}
bind("opacity",v=>Math.round(v*100)+"%");bind("feather",v=>Math.round(v)+"px");bind("bodyScale",v=>v.toFixed(2)+"×");

async function init(){
 try{
   await tf.setBackend("webgl");await tf.ready();
   segmenter=await bodySegmentation.createSegmenter(
     bodySegmentation.SupportedModels.MediaPipeSelfieSegmentation,
     {runtime:"mediapipe",solutionPath:"https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation",modelType:"general"}
   );
   $("segDot").classList.add("ok");$("segText").textContent="Cutout ready";
 }catch(e){console.warn("segmentation unavailable",e);$("segText").textContent="Cutout fallback"}
 try{
   vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm");
   const fmodel="https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
   const pmodel="https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";
   faceImgAI=await FaceLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:fmodel,delegate:"GPU"},runningMode:"IMAGE",numFaces:1,outputFaceBlendshapes:true});
   faceVidAI=await FaceLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:fmodel,delegate:"GPU"},runningMode:"VIDEO",numFaces:1,outputFaceBlendshapes:true});
   poseImgAI=await PoseLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:pmodel,delegate:"GPU"},runningMode:"IMAGE",numPoses:1});
   poseVidAI=await PoseLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:pmodel,delegate:"GPU"},runningMode:"VIDEO",numPoses:1});
   msg("Ready — choose a woman, then tap ▶");
 }catch(e){console.error(e);msg("Tracking AI failed");}
}

$("refFile").onchange=e=>{
 const f=e.target.files?.[0];if(!f)return;if(refURL)URL.revokeObjectURL(refURL);refURL=URL.createObjectURL(f);
 refImg.onload=async()=>{
   try{
     const fr=faceImgAI.detect(refImg),pr=poseImgAI.detect(refImg);
     refFace=fr.faceLandmarks?.[0]||null;refPose=pr.landmarks?.[0]||null;
     await makeReferenceCutout();
     msg(running?"Reference woman active":"Woman prepared — tap ▶");
     if(!refPose)note("Face-only reference","For body replacement, a photo showing her torso or full body works much better.");
     else note("Reference prepared","Her original background has been removed. Face and body will be placed into your live camera scene.");
   }catch(err){console.error(err);note("Reference error","Could not prepare that photo.");}
 };refImg.src=refURL;
};

async function makeReferenceCutout(){
 const W=refImg.naturalWidth,H=refImg.naturalHeight;
 refCut=document.createElement("canvas");refCut.width=W;refCut.height=H;
 const c=refCut.getContext("2d");c.clearRect(0,0,W,H);
 if(segmenter){
   try{
     const people=await segmenter.segmentPeople(refImg,{multiSegmentation:false,segmentBodyParts:false});
     if(people?.length){
       const mask=await bodySegmentation.toMask(people, {r:255,g:255,b:255,a:255}, {r:0,g:0,b:0,a:0}, false);
       const mc=document.createElement("canvas");mc.width=mask.width;mc.height=mask.height;mc.getContext("2d").putImageData(mask,0,0);
       c.drawImage(refImg,0,0,W,H);c.globalCompositeOperation="destination-in";c.filter=`blur(${$("feather").value}px)`;c.drawImage(mc,0,0,W,H);c.filter="none";c.globalCompositeOperation="source-over";
       refMask=mc;return;
     }
   }catch(e){console.warn(e)}
 }
 c.drawImage(refImg,0,0,W,H);
}

async function openCamera(){
 try{
   if(!window.isSecureContext){note("HTTPS required","Open your GitHub Pages link.");return}
   stream?.getTracks().forEach(t=>t.stop());
   try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false})}catch(e){stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false})}
   video.srcObject=stream;video.muted=true;video.setAttribute("playsinline","");await video.play();running=true;lastVideo=-1;prevFace=prevPose=null;
   $("camDot").classList.add("ok");$("camText").textContent=facing==="user"?"Front camera":"Back camera";$("start").textContent="■";requestAnimationFrame(loop)
 }catch(e){note("Camera error",(e.name||"Error")+": "+(e.message||"Could not start camera"))}
}
function stop(){running=false;stream?.getTracks().forEach(t=>t.stop());stream=null;$("camDot").classList.remove("ok");$("start").textContent="▶"}
$("start").onclick=()=>running?stop():openCamera();$("flip").onclick=async()=>{facing=facing==="user"?"environment":"user";if(running)await openCamera()};

function resize(){const w=video.videoWidth||720,h=video.videoHeight||1280;if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}}
function proj(l){const m=$("mirror").checked;return l?.map(p=>({x:(m?1-p.x:p.x)*canvas.width,y:p.y*canvas.height,z:p.z||0,visibility:p.visibility??1}))||null}
function smooth(prev,n){if(!n)return null;if(!prev||prev.length!==n.length)return n.map(p=>({...p}));const k=.58;for(let i=0;i<n.length;i++){prev[i].x+=(n[i].x-prev[i].x)*k;prev[i].y+=(n[i].y-prev[i].y)*k;prev[i].z+=(n[i].z-prev[i].z)*k}return prev}
function drawCamera(){const m=$("mirror").checked;ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle="#020305";ctx.fillRect(0,0,canvas.width,canvas.height);ctx.save();if(m){ctx.translate(canvas.width,0);ctx.scale(-1,1)}ctx.drawImage(video,0,0,canvas.width,canvas.height);ctx.restore()}

function uprightAngle(a){
 while(a>Math.PI/2)a-=Math.PI;
 while(a<-Math.PI/2)a+=Math.PI;
 return a;
}
function torsoBox(p){
 if(!p)return null;const ids=[11,12,23,24];if(ids.some(i=>!p[i]))return null;
 const shL=p[11],shR=p[12],hpL=p[23],hpR=p[24],cx=(shL.x+shR.x+hpL.x+hpR.x)/4,top=(shL.y+shR.y)/2,bottom=(hpL.y+hpR.y)/2;
 const width=(Math.hypot(shR.x-shL.x,shR.y-shL.y)+Math.hypot(hpR.x-hpL.x,hpR.y-hpL.y))*.62;
 return {cx,cy:(top+bottom)/2,w:width,h:Math.abs(bottom-top)*1.35,angle:uprightAngle(Math.atan2(shR.y-shL.y,shR.x-shL.x))};
}
function refTorsoBox(){
 if(!refPose)return null;const W=refImg.naturalWidth,H=refImg.naturalHeight,p=refPose.map(q=>({x:q.x*W,y:q.y*H}));
 return torsoBox(p);
}
function drawReferenceBody(livePose){
 if(!$("body").checked||!refCut||!livePose)return;
 const a=torsoBox(livePose),b=refTorsoBox();if(!a||!b||b.h<1)return;
 const userScale=+$("bodyScale").value,opacity=+$("opacity").value;

 // Scale the entire reference by live-torso / reference-torso ratio.
 // This keeps the person's real proportions instead of enlarging a portrait to fill the frame.
 const scale=(a.h/b.h)*userScale;
 const targetW=refImg.naturalWidth*scale,targetH=refImg.naturalHeight*scale;
 const refTorsoCx=b.cx*scale,refTorsoCy=b.cy*scale;

 ctx.save();
 ctx.translate(a.cx,a.cy);
 ctx.rotate(a.angle);
 ctx.globalAlpha=opacity;
 ctx.shadowColor="rgba(0,0,0,.14)";
 ctx.shadowBlur=4;
 ctx.drawImage(refCut,-refTorsoCx,-refTorsoCy,targetW,targetH);
 ctx.restore();
}

function blendMap(r){const m={};for(const c of r.faceBlendshapes?.[0]?.categories||[])m[c.categoryName]=c.score;return m}
function val(m,n){return m[n]||0}
function faceBox(p){if(!p)return null;const L=p[234],R=p[454],T=p[10],B=p[152];if(!L||!R||!T||!B)return null;return{cx:(L.x+R.x)/2,cy:(T.y+B.y)/2,w:Math.abs(R.x-L.x)*1.18,h:Math.abs(B.y-T.y)*1.12,angle:uprightAngle(Math.atan2(R.y-L.y,R.x-L.x))}}
function refFaceBox(){if(!refFace)return null;const W=refImg.naturalWidth,H=refImg.naturalHeight,p=refFace.map(q=>({x:q.x*W,y:q.y*H}));return faceBox(p)}
function drawFace(live,bm){
 if(!$("face").checked||!refCut||!live)return;const a=faceBox(live),b=refFaceBox();if(!a||!b)return;
 const opacity=+$("opacity").value,scale=a.w/b.w,dw=refImg.naturalWidth*scale,dh=refImg.naturalHeight*scale;
 const ox=b.cx*scale,oy=b.cy*scale;
 ctx.save();ctx.translate(a.cx,a.cy);ctx.rotate(a.angle);ctx.globalAlpha=opacity;
 // clip to soft ellipse so reference background/body doesn't cover surrounding scene
 ctx.beginPath();ctx.ellipse(0,0,a.w*.61,a.h*.58,0,0,Math.PI*2);ctx.clip();
 ctx.drawImage(refCut,-ox,-oy,dw,dh);ctx.restore();
 drawExpressions(live,bm);
}
function drawExpressions(face,b){
 const blink=Math.max(val(b,"eyeBlinkLeft"),val(b,"eyeBlinkRight")),jaw=val(b,"jawOpen"),smile=(val(b,"mouthSmileLeft")+val(b,"mouthSmileRight"))/2;
 if(blink>.42){
   ctx.save();ctx.strokeStyle="rgba(65,38,38,.72)";ctx.lineCap="round";
   for(const [a,z] of [[33,133],[362,263]]){const p=face[a],q=face[z];if(p&&q){ctx.lineWidth=Math.max(2,Math.abs(q.x-p.x)*.08);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke()}}ctx.restore();
 }
 if(jaw>.16||smile>.3){
   const L=face[78],R=face[308],U=face[13],D=face[14];if(!L||!R||!U||!D)return;
   const w=Math.abs(R.x-L.x),h=Math.max(3,Math.abs(D.y-U.y));
   ctx.save();ctx.beginPath();ctx.ellipse((L.x+R.x)/2,(U.y+D.y)/2,w*.47,h*.55,0,0,Math.PI*2);ctx.clip();
   ctx.fillStyle="rgba(44,9,15,.9)";ctx.fillRect(Math.min(L.x,R.x),Math.min(U.y,D.y)-4,w,h+8);
   const th=Math.min(h*.52,w*.14);ctx.fillStyle="rgba(249,247,240,.96)";ctx.fillRect(Math.min(L.x,R.x)+w*.1,Math.min(U.y,D.y),w*.8,th);ctx.restore();
 }
}

async function updateLiveSeg(){
 if(!segmenter||segBusy||!running)return;segBusy=true;
 try{
   const people=await segmenter.segmentPeople(video,{multiSegmentation:false,segmentBodyParts:false});
   liveSeg=people?.[0]||null;$("segDot").classList.toggle("ok",!!liveSeg);
 }catch(e){}finally{segBusy=false}
}

function drawMaskDebug(){
 if(!$("maskDebug").checked||!liveSeg)return;
 // Lightweight outline approximation from pose; actual mask is used for reference cutout.
 ctx.save();ctx.globalAlpha=.18;ctx.fillStyle="#fff";const p=prevPose;if(p){const b=torsoBox(p);if(b){ctx.translate(b.cx,b.cy);ctx.rotate(b.angle);ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h)}}ctx.restore();
}

async function loop(ts){
 if(!running)return;resize();drawCamera();
 if(faceVidAI&&poseVidAI&&video.readyState>=2&&video.currentTime!==lastVideo){
   lastVideo=video.currentTime;
   try{
     const [fr,pr]=await Promise.all([faceVidAI.detectForVideo(video,ts),poseVidAI.detectForVideo(video,ts)]);
     if(fr.faceLandmarks?.length){prevFace=smooth(prevFace,proj(fr.faceLandmarks[0]));$("faceDot").classList.add("ok");$("faceText").textContent="Face locked"}else{$("faceDot").classList.remove("ok")}
     if(pr.landmarks?.length){prevPose=smooth(prevPose,proj(pr.landmarks[0]));$("poseDot").classList.add("ok");$("poseText").textContent="Body locked"}else{$("poseDot").classList.remove("ok")}
     if(++segCounter%3===0)updateLiveSeg();
     if(refCut){drawReferenceBody(prevPose);drawFace(prevFace,blendMap(fr))}
     drawMaskDebug();
   }catch(e){console.error(e)}
 }
 frames++;if(ts-fpsStart>800){$("fps").textContent=Math.round(frames*1000/(ts-fpsStart))+" fps";frames=0;fpsStart=ts}
 requestAnimationFrame(loop)
}

canvas.width=720;canvas.height=1280;ctx.fillStyle="#020305";ctx.fillRect(0,0,720,1280);ctx.fillStyle="#f5f7fb";ctx.textAlign="center";ctx.font="700 31px system-ui";ctx.fillText("Scene compositing",360,600);ctx.fillStyle="#9aa6b8";ctx.font="18px system-ui";ctx.fillText("Choose a woman, then tap ▶",360,638);
init();
</script>
</body>
</html>
